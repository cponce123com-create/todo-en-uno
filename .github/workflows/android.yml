name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Tests y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Ejecutar pruebas y compilar
        run: gradle :feature:utilities:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: todo-en-uno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
