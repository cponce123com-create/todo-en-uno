name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Tests y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en el ejecutor"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validar Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
      - name: Pruebas globales, Lint y compilación de APKs
        run: ./gradlew :core:catalog:test testDebugUnitTest lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Conservar informes Lint y JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-en-uno-quality-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: todo-en-uno-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ui-tests:
    name: Pruebas de navegación y favoritos en emulador API 35
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Habilitar KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36"
      - name: Ejecutar ComposeTestRule en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: |
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 20); do
              if adb shell getprop sys.boot_completed | grep -q "1" && adb shell cmd package list packages >/dev/null 2>&1; then
                ready=1
                break
              fi
              echo "Esperando PackageManager del emulador: intento $attempt"
              sleep 4
            done
            if [ "$ready" -ne 1 ]; then
              echo "El sistema Android del emulador no terminó de iniciarse"
              exit 1
            fi
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Informes instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-en-uno-ui-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
